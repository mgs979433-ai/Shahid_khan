<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MiniFlix - Animated Version</title>

    <!-- GOOGLE FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /* NAV */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 18px 40px;
            align-items: center;
            background: rgba(0,0,0,0.6);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(6px);
            animation: slideDown 0.6s ease-out;
        }

        nav img {
            width: 130px;
            animation: fadeIn 1.2s ease-out;
        }

        nav input {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            outline: none;
            width: 240px;
            font-size: 14px;
            background-color: #1e1e1e;
            color: white;
            transition: 0.3s;
        }

        nav input:focus {
            width: 280px;
            background-color: #333;
        }

        /* HERO */
        .hero {
            height: 70vh;
            background-image: url('https://images6.alphacoders.com/112/1126997.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 50px;
            animation: fadeIn 1.5s ease-in-out;
        }

        .hero h1 {
            font-size: 50px;
            font-weight: 600;
            animation: textSlide 1.2s ease;
        }

        .hero p {
            font-size: 20px;
            width: 50%;
            animation: fadeIn 2s ease;
        }

        /* TITLES */
        .section-title {
            font-size: 28px;
            margin: 20px 40px;
            animation: fadeIn 1.2s ease;
        }

        /* MOVIES ROW */
        .movies {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 0 40px 20px 40px;
        }

        .movie {
            min-width: 180px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            opacity: 0;
            animation: fadeUp 1s forwards;
        }

        .movie:hover {
            transform: scale(1.12);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .movie img {
            width: 100%;
            border-radius: 8px;
        }

        /* PLAYER POPUP */
        #playerModal {
            display: none;
            position: fixed;
            top: 0; 
            left: 0;
            height: 100%;
            width: 100%;
            background: rgba(0,0,0,0.92);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.4s;
        }

        #playerModal video {
            width: 70%;
            border-radius: 10px;
            border: 2px solid white;
            animation: scaleIn 0.5s ease;
        }

        #closeBtn {
            margin-top: 20px;
            padding: 10px 25px;
            background: red;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }

        #closeBtn:hover {
            background: darkred;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes fadeUp {
            from {transform: translateY(25px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }

        @keyframes scaleIn {
            from {transform: scale(0.7);}
            to {transform: scale(1);}
        }

        @keyframes slideDown {
            from {transform: translateY(-30px); opacity: 0;}
            to {transform: translateY(0); opacity: 1;}
        }

        @keyframes textSlide {
            from {transform: translateX(-40px); opacity: 0;}
            to {transform: translateX(0); opacity: 1;}
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 35px; }
            .hero p { width: 90%; }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <nav>
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
        <input type="text" id="searchBar" placeholder="Search movies...">
    </nav>

    <!-- HERO -->
    <div class="hero">
        <h1>MiniFlix – Watch Instantly</h1>
        <p>Experience smooth animations, clean UI and fast streaming.</p>
    </div>

    <!-- MOVIE SECTION -->
    <h2 class="section-title">Trending Now</h2>

    <div class="movies" id="movieList">
        <div class="movie" data-name="Stranger Things" data-video="https://www.w3schools.com/html/mov_bbb.mp4">
            <img src="https://flxt.tmsimg.com/assets/p12990234_b1t_v10_aa.jpg">
        </div>

        <div class="movie" data-name="Money Heist" data-video="https://www.w3schools.com/html/movie.mp4">
            <img src="https://m.media-amazon.com/images/I/81c7Mo8RX7L.jpg">
        </div>

        <div class="movie" data-name="Joker" data-video="https://www.w3schools.com/html/mov_bbb.mp4">
            <img src="https://m.media-amazon.com/images/I/71niXI3lxlL._AC_SL1500_.jpg">
        </div>

        <div class="movie" data-name="Extraction" data-video="https://www.w3schools.com/html/movie.mp4">
            <img src="https://m.media-amazon.com/images/I/81P4ZVHK7FL.jpg">
        </div>
    </div>

    <!-- PLAYER POPUP -->
    <div id="playerModal">
        <video id="player" controls autoplay></video>
        <button id="closeBtn">Close</button>
    </div>


<script>
/* ---------------- FUNCTIONS ---------------- */

function openPlayer(videoURL) {
    const modal = document.getElementById("playerModal");
    const video = document.getElementById("player");

    video.src = videoURL;
    modal.style.display = "flex";
}

function closePlayer() {
    const modal = document.getElementById("playerModal");
    const video = document.getElementById("player");

    modal.style.display = "none";
    video.pause();
}

function setupMovieClickEvents() {
    const movies = document.querySelectorAll(".movie");

    movies.forEach(movie => {
        movie.onclick = () => openPlayer(movie.dataset.video);
    });
}

function setupSearchBar() {
    const searchBar = document.getElementById("searchBar");
    const movies = document.querySelectorAll(".movie");

    searchBar.addEventListener("keyup", () => {
        let query = searchBar.value.toLowerCase();

        movies.forEach(movie => {
            let title = movie.dataset.name.toLowerCase();
            movie.style.display = title.includes(query) ? "block" : "none";
        });
    });
}

/* ---------------- INITIALIZE ---------------- */

document.getElementById("closeBtn").onclick = closePlayer;
setupMovieClickEvents();
setupSearchBar();

</script>

</body>
</html>
