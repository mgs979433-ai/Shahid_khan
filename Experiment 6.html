<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy Product Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f4f8;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 24px;
      font-weight: bold;
    }

    .product-card {
      width: 300px;
      background-color: white;
      margin: 50px auto;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      text-align: center;
      padding: 15px;
    }

    .product-card img {
      width: 250px;
      height: 250px;
      border-radius: 5px;
    }

    .product-title {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
      color: #333;
    }

    .product-description {
      font-size: 14px;
      color: #555;
      margin: 8px 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      color: #007b00;
    }

    .old-price {
      text-decoration: line-through;
      color: #888;
      font-size: 14px;
      margin-left: 8px;
    }

    .add-to-cart {
      display: inline-block;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 15px;
      transition: 0.3s;
    }

    .add-to-cart:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <header>ShopEasy</header>

  <div class="product-card">
    <img src="/green tshirt.png" alt="T-Shirt">
    <div class="product-title">Classic Cotton T-Shirt</div>
    <div class="product-description">Soft, breathable cotton. Regular fit. Available in multiple colors.</div>
    <div>
      <span class="price">₹799</span>
      <span class="old-price">₹1,499</span>
    </div>
    <a href="#" class="add-to-cart">Add to Cart</a>
  </div>
<text align="center"> 
<p>Mohd Shahid Khan</p>
<p>Branch : CSE-21</p>
<p>Admission : 2025B01011225</p>
</text>

</body>
</html>
